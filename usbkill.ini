[config]
# How often to poll USB devices, in milliseconds.
poll_interval_ms = 250

# What to do when an unauthorized USB change is detected:
#   shutdown  - power off immediately (default)
#   lock      - lock the session only
#   log       - record the event, take no destructive action
action = shutdown

# Commands to run before the action fires, separated by ';'. Optional.
# Example (Linux): sync ; echo 1 > /proc/sys/vm/drop_caches
pre_commands =

# Safety switch. When true, usbkill logs what it *would* do and never fires.
# Recommended while you tune poll_interval_ms and confirm your baseline.
dry_run = true
